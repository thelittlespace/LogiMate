name: Dispatch Build 019 release once

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release Candidate on exact Build 019 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-candidate.yml --repo "$GITHUB_REPOSITORY" --ref v0.0.1-alpha.019

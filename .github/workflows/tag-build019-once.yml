name: Tag Build 019 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Create exact Build 019 release tag
        shell: bash
        run: |
          set -euo pipefail
          target='984604009cd03aca042ae3acac884d8c7afa0d82'
          tag='v0.0.1-alpha.019'
          test "$(git show "$target:BUILD")" = "019"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$tag")" = "$target"
            echo "$tag already points to the intended commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$target" -m "LogiMate 0.0.1-alpha Build 019"
            git push origin "$tag"
          fi

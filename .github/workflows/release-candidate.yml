name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.0.1-alpha.*'

permissions:
  contents: read

jobs:
  quality-linux:
    name: Go 1.27.1 format, unit and race gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove exact Go toolchain
        shell: bash
        run: |
          test "$(go env GOVERSION)" = "go1.27.1"
          go version
      - name: Verify gofmt
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || { echo "Files need gofmt:"; gofmt -l .; exit 1; }
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./internal/wheelengine ./internal/openg27port ./internal/gameadapter

  codeql:
    name: CodeQL · Go 1.27.1
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove exact Go toolchain
        shell: pwsh
        run: |
          if ((go env GOVERSION).Trim() -ne 'go1.27.1') { throw "Expected go1.27.1, got $(go env GOVERSION)" }
          go version
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: go
      - name: Build extraction target
        shell: pwsh
        run: |
          go test ./...
          $v=(Get-Content VERSION -Raw).Trim()
          $b=(Get-Content BUILD -Raw).Trim()
          go build -buildvcs=false -trimpath -ldflags "-H=windowsgui -X main.version=$v -X main.buildID=$b" -o LogiMate-CodeQL.exe ./cmd/logimate
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  build:
    name: Build, reproduce and attest Go 1.27.1 alpha release
    needs: [quality-linux, codeql]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches VERSION and BUILD
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $v=(Get-Content VERSION -Raw).Trim()
          $b=(Get-Content BUILD -Raw).Trim()
          $expected="v$($v).$($b)"
          $actual="$env:GITHUB_REF_NAME"
          if ($actual -ne $expected) { throw "Tag $actual does not match expected $expected" }
      - name: Verified Go 1.27.1 / PowerShell 7.6.6 release build
        shell: powershell
        run: .\Build-Release-Go1271.ps1 -KeepTools
      - name: Verify release attestation identity
        shell: powershell
        run: |
          $att=Get-Content dist\RELEASE_ATTESTATION.json -Raw | ConvertFrom-Json
          if ($att.version -ne '0.0.1-alpha' -or $att.build -ne '020') { throw 'Wrong release identity' }
          if ($att.toolchain.goEnvVersion -ne 'go1.27.1') { throw "Wrong release Go: $($att.toolchain.goEnvVersion)" }
          if ($att.toolchain.powerShellVersion -ne '7.6.6') { throw "Wrong release PowerShell: $($att.toolchain.powerShellVersion)" }
      - name: Attest standalone application
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LogiMate.exe
      - name: Attest installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LogiMate-Setup-x64.exe
      - name: Attest portable archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LogiMate-Portable-x64.zip
      - name: Attest ARM64 validation build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LogiMate-arm64-validation.exe
      - name: Attest source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LogiMate-Source.zip
      - name: Attest GitHub-ready archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LogiMate-GitHub-Ready.zip
      - name: Attest complete release bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: LogiMate-0.0.1-alpha-Build020-Go1.27.1-Release.zip
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LogiMate-${{ github.ref_name || 'manual' }}
          path: |
            LogiMate-0.0.1-alpha-Build020-Go1.27.1-Release.zip
            dist/LogiMate.exe
            dist/LogiMate-Setup-x64.exe
            dist/LogiMate-Portable-x64.zip
            dist/LogiMate-arm64-validation.exe
            dist/LogiMate-Source.zip
            dist/LogiMate-GitHub-Ready.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_ATTESTATION.json
            dist/Build020-Go1.27.1-Release-Gate.txt
            dist/PACKAGE_VERIFICATION.txt
            dist/LogiMate-0.0.1-alpha-Build020-Completion-Report.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'LogiMate-0.0.1-alpha-Build020-Go1.27.1-Release.zip',
            'dist/LogiMate.exe',
            'dist/LogiMate-Setup-x64.exe',
            'dist/LogiMate-Portable-x64.zip',
            'dist/LogiMate-arm64-validation.exe',
            'dist/LogiMate-Source.zip',
            'dist/LogiMate-GitHub-Ready.zip',
            'dist/SHA256SUMS.txt',
            'dist/RELEASE_ATTESTATION.json',
            'dist/Build020-Go1.27.1-Release-Gate.txt',
            'dist/PACKAGE_VERIFICATION.txt',
            'dist/LogiMate-0.0.1-alpha-Build020-Completion-Report.md'
          )
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:GITHUB_REF_NAME" --title "LogiMate 0.0.1-alpha · Build 020" --notes-file RELEASE_NOTES.txt --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release metadata update failed' }
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release asset refresh failed' }
          } else {
            gh release create "$env:GITHUB_REF_NAME" --title "LogiMate 0.0.1-alpha · Build 020" --notes-file RELEASE_NOTES.txt --prerelease @assets
            if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease creation failed' }
          }
